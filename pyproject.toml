[project]
name = "taskboard"
version = "0.1.0"
description = "A frameless kanban desktop-widget task board built in Textual."
requires-python = ">=3.10"
dependencies = ["textual", "tzdata", "pillow>=10.3.0", "textual-image>=0.13"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
taskboard = "taskboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taskboard"]

[tool.setuptools.package-data]
taskboard = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `prototypes/out/` is the scratch yard, and one file in it -- `_b37_test.py` --
# matched pytest's default `python_files = test_*.py *_test.py`. A bare `pytest`
# from the repo root COLLECTED it, which runs its module body, which appends a
# block to `tests/test_components.py`. Three gate runs left three copies in HEAD
# and the count never moved because the duplicate `def`s shadow each other.
# Collection is now confined to the suite. The probe was renamed as well
# (`_b37_probe.py`): either fix alone would do, and a scratch yard that pytest
# can reach at all is the thing worth closing twice.
testpaths = ["tests"]
